apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
data:
  definitions.json: |
    {
      "queues": [
        {
          "name": "cargas",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ]
    }
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
    default_user = admin
    default_pass = admin123

